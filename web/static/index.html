<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #ffd700, #ff6b35, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.75em;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffd700;
        }

        .banner-info {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(255, 215, 0, 0.1));
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            margin: 15px 0;
            text-align: center;
        }

        .banner-info h3 {
            color: #ffd700;
            margin-bottom: 8px;
        }

        .banner-featured {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .banner-featured span {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .pull-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-pull {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-pull10 {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn-currency {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #000;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Pull Results */
        .results-area {
            min-height: 200px;
            margin: 20px 0;
        }

        .pull-results {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .character-card {
            width: 140px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: cardReveal 0.6s ease backwards;
        }

        .character-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.15;
            z-index: 0;
        }

        .character-card > * { position: relative; z-index: 1; }

        .character-card.common {
            background: linear-gradient(135deg, #4a4a4a, #2d2d2d);
            border: 2px solid #666;
        }

        .character-card.rare {
            background: linear-gradient(135deg, #1a4a8a, #0d2d5a);
            border: 2px solid #4a9eff;
            box-shadow: 0 0 15px rgba(74, 158, 255, 0.3);
        }

        .character-card.epic {
            background: linear-gradient(135deg, #5a1a8a, #3d0d5a);
            border: 2px solid #b44aff;
            box-shadow: 0 0 20px rgba(180, 74, 255, 0.4);
        }

        .character-card.legendary {
            background: linear-gradient(135deg, #8a6a1a, #5a3d0d);
            border: 2px solid #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            animation: cardReveal 0.6s ease backwards, legendaryGlow 2s infinite alternate;
        }

        @keyframes legendaryGlow {
            from { box-shadow: 0 0 25px rgba(255, 215, 0, 0.5); }
            to { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); }
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: scale(0.5) rotateY(180deg); }
            to { opacity: 1; transform: scale(1) rotateY(0); }
        }

        .char-icon {
            font-size: 2.2em;
            margin-bottom: 8px;
        }

        .char-name {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 4px;
        }

        .char-rarity {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .char-element {
            font-size: 0.75em;
            margin-top: 4px;
            opacity: 0.7;
        }

        .char-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.6em;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
        }

        .badge-new {
            background: #00e676;
            color: #000;
        }

        .badge-featured {
            background: #ffd700;
            color: #000;
        }

        .badge-pity {
            background: #ff4081;
            color: #fff;
        }

        /* Inventory */
        .section-title {
            font-size: 1.3em;
            margin: 30px 0 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .inventory-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .inventory-card {
            width: 120px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85em;
        }

        .inventory-card.common { background: rgba(100, 100, 100, 0.3); border: 1px solid #555; }
        .inventory-card.rare { background: rgba(74, 158, 255, 0.15); border: 1px solid #4a9eff; }
        .inventory-card.epic { background: rgba(180, 74, 255, 0.15); border: 1px solid #b44aff; }
        .inventory-card.legendary { background: rgba(255, 215, 0, 0.15); border: 1px solid #ffd700; }

        .pity-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }

        .pity-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
            background: linear-gradient(90deg, #4facfe, #f093fb, #ffd700);
        }

        .message {
            text-align: center;
            padding: 10px;
            font-size: 1.1em;
            min-height: 40px;
        }

        .message.error { color: #ff4444; }
        .message.success { color: #00e676; }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .tab-btn {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            color: #ffd700;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Gacha Legends ⚔️</h1>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Currency</div>
                <div class="stat-value" id="currency">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Total Pulls</div>
                <div class="stat-value" id="total-pulls">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Unique Chars</div>
                <div class="stat-value" id="unique-chars">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Pity Counter</div>
                <div class="stat-value" id="pity-count">-</div>
            </div>
        </div>

        <div class="pity-bar">
            <div class="pity-fill" id="pity-bar-fill" style="width: 0%"></div>
        </div>

        <div class="banner-info" id="banner-info">
            <h3 id="banner-name">Loading banner...</h3>
            <div class="banner-featured" id="banner-featured"></div>
        </div>

        <div class="pull-buttons">
            <button class="btn btn-pull" id="btn-pull" onclick="doPull()">
                Pull ×1 (160💎)
            </button>
            <button class="btn btn-pull10" id="btn-pull10" onclick="doMultiPull()">
                Pull ×10 (1440💎)
            </button>
            <button class="btn btn-currency" onclick="addCurrency()">
                + Free Currency
            </button>
        </div>

        <div class="message" id="message"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('results')">Pull Results</button>
            <button class="tab-btn" onclick="switchTab('inventory')">Inventory</button>
        </div>

        <div class="tab-content active" id="tab-results">
            <div class="results-area">
                <div class="pull-results" id="pull-results">
                    <p style="color: #888; text-align: center; width: 100%;">
                        Click "Pull" to summon characters!
                    </p>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-inventory">
            <div class="inventory-grid" id="inventory-grid">
                <p style="color: #888;">No characters yet. Start pulling!</p>
            </div>
        </div>
    </div>

    <script>
        const ELEMENT_ICONS = {
            'Fire': '🔥', 'Water': '💧', 'Wind': '🌪️',
            'Earth': '🌍', 'Lightning': '⚡'
        };

        const RARITY_STARS = {
            'common': '★', 'rare': '★★★',
            'epic': '★★★★', 'legendary': '★★★★★'
        };

        async function fetchState() {
            const res = await fetch('/api/state');
            const state = await res.json();
            document.getElementById('currency').textContent = state.currency.toLocaleString() + ' 💎';
            document.getElementById('total-pulls').textContent = state.total_pulls;
            document.getElementById('unique-chars').textContent = state.unique_characters;
            document.getElementById('pity-count').textContent = state.pity_count + '/90';

            const pityPct = (state.pity_count / 90) * 100;
            document.getElementById('pity-bar-fill').style.width = pityPct + '%';

            document.getElementById('btn-pull').disabled = state.currency < 160;
            document.getElementById('btn-pull10').disabled = state.currency < 1440;
        }

        async function fetchBanner() {
            const res = await fetch('/api/banner');
            const banner = await res.json();
            document.getElementById('banner-name').textContent = '🎯 ' + banner.name;
            const featuredEl = document.getElementById('banner-featured');
            featuredEl.innerHTML = banner.featured.map(c =>
                `<span>${ELEMENT_ICONS[c.element] || '✨'} ${c.name} (${c.rarity})</span>`
            ).join('');
        }

        async function doPull() {
            setMessage('Pulling...', '');
            const res = await fetch('/api/pull', { method: 'POST' });
            const data = await res.json();
            if (!data.success) {
                setMessage(data.message, 'error');
                return;
            }
            displayResults(data.results);
            setMessage(data.message, 'success');
            fetchState();
        }

        async function doMultiPull() {
            setMessage('Pulling ×10...', '');
            const res = await fetch('/api/pull10', { method: 'POST' });
            const data = await res.json();
            if (!data.success) {
                setMessage(data.message, 'error');
                return;
            }
            displayResults(data.results);
            setMessage(data.message, 'success');
            fetchState();
        }

        async function addCurrency() {
            await fetch('/api/add-currency', { method: 'POST' });
            setMessage('+1600 currency added!', 'success');
            fetchState();
        }

        function displayResults(results) {
            const container = document.getElementById('pull-results');
            container.innerHTML = results.map((char, i) => {
                let badges = '';
                if (char.is_pity) badges += '<span class="char-badge badge-pity">PITY</span>';
                else if (char.is_featured) badges += '<span class="char-badge badge-featured">RATE UP</span>';
                else if (char.is_new) badges += '<span class="char-badge badge-new">NEW</span>';

                return `
                    <div class="character-card ${char.rarity}" style="animation-delay: ${i * 0.1}s">
                        ${badges}
                        <div class="char-icon">${ELEMENT_ICONS[char.element] || '✨'}</div>
                        <div class="char-name">${char.name}</div>
                        <div class="char-rarity">${RARITY_STARS[char.rarity]}</div>
                        <div class="char-element">${char.element} · PWR ${char.power_rating}</div>
                    </div>
                `;
            }).join('');
        }

        async function loadInventory() {
            const res = await fetch('/api/inventory');
            const inventory = await res.json();
            const grid = document.getElementById('inventory-grid');
            if (inventory.length === 0) {
                grid.innerHTML = '<p style="color: #888;">No characters yet. Start pulling!</p>';
                return;
            }
            grid.innerHTML = inventory.map(char => `
                <div class="inventory-card ${char.rarity}">
                    <div class="char-icon">${ELEMENT_ICONS[char.element] || '✨'}</div>
                    <div class="char-name">${char.name}</div>
                    <div class="char-rarity">${RARITY_STARS[char.rarity]}</div>
                    <div class="char-element">PWR ${char.power_rating}</div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'inventory') loadInventory();
        }

        function setMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + (type || '');
        }

        // Initialize
        fetchState();
        fetchBanner();
    </script>
</body>
</html>

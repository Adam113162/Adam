<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Legends 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; cursor: crosshair; }
        canvas { display: block; }

        .hud-top {
            position: fixed; top: 15px; left: 15px; z-index: 100;
            display: flex; gap: 12px; align-items: flex-start;
        }

        .char-info {
            background: rgba(0,0,0,0.7); border-radius: 12px; padding: 10px 15px;
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
            min-width: 180px;
        }

        .char-info .name { color: #ffd700; font-weight: bold; font-size: 1.1em; }
        .char-info .element { color: #aaa; font-size: 0.8em; margin-top: 2px; }

        .hp-bar-outer {
            width: 100%; height: 6px; background: rgba(255,255,255,0.15);
            border-radius: 3px; margin-top: 6px; overflow: hidden;
        }
        .hp-bar-inner {
            height: 100%; background: linear-gradient(90deg, #4cff4c, #88ff00);
            border-radius: 3px; transition: width 0.3s;
        }

        .hud-top-right {
            position: fixed; top: 15px; right: 15px; z-index: 100;
            background: rgba(0,0,0,0.7); border-radius: 12px; padding: 10px 15px;
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
            text-align: right; color: #fff;
        }
        .hud-top-right .currency { color: #ffd700; font-size: 1.3em; font-weight: bold; }
        .hud-top-right .info { color: #aaa; font-size: 0.8em; margin-top: 3px; }

        .party-bar {
            position: fixed; right: 15px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 6px; z-index: 100;
        }
        .party-slot {
            width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25);
            background: rgba(0,0,0,0.6); display: flex; align-items: center;
            justify-content: center; font-size: 1.5em; cursor: pointer;
            transition: all 0.2s; position: relative;
            backdrop-filter: blur(4px);
        }
        .party-slot.active { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.5); transform: scale(1.1); }
        .party-slot.locked { opacity: 0.4; cursor: default; }
        .party-slot .key-hint { position: absolute; top: -6px; right: -4px; background: rgba(0,0,0,0.9); color: #fff; font-size: 0.5em; padding: 2px 5px; border-radius: 3px; }
        .party-slot .mini-hp { position: absolute; bottom: 3px; left: 8px; right: 8px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        .party-slot .mini-hp-fill { height: 100%; background: #4cff4c; border-radius: 2px; }

        .abilities {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 100;
        }
        .ability-btn {
            width: 56px; height: 56px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.7); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff;
            font-size: 0.75em; backdrop-filter: blur(4px); position: relative;
        }
        .ability-btn .key { font-weight: bold; font-size: 1.3em; }
        .ability-btn .cd { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); border-radius: 10px; font-size: 1.1em; color: #ff6666; display: none; }

        .enemy-hp-bar {
            position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -100%);
            text-align: center; display: none;
        }
        .enemy-hp-bar .name { color: #fff; font-size: 0.65em; text-shadow: 0 1px 3px rgba(0,0,0,0.8); margin-bottom: 2px; }
        .enemy-hp-bar .fill { height: 4px; background: linear-gradient(90deg, #ff4444, #ff8800); border-radius: 2px; transition: width 0.2s; display: block; width: 100%; }
        .enemy-hp-bar .track { width: 60px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; }

        .dmg-popup { position: fixed; z-index: 200; pointer-events: none; font-weight: bold; animation: dmgFloat 0.8s ease-out forwards; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .dmg-popup.normal { color: #fff; font-size: 1.2em; }
        .dmg-popup.element { color: #ffdd44; font-size: 1.6em; }
        @keyframes dmgFloat { 0% { opacity: 1; transform: translateY(0) scale(1.2); } 100% { opacity: 0; transform: translateY(-50px) scale(0.7); } }

        .kill-banner { position: fixed; top: 30%; left: 50%; transform: translateX(-50%); z-index: 200; background: rgba(0,0,0,0.85); color: #ffd700; padding: 12px 28px; border-radius: 8px; font-size: 1.2em; font-weight: bold; animation: killFade 1.5s ease-out forwards; border: 1px solid rgba(255,215,0,0.3); }
        @keyframes killFade { 0% { opacity: 0; transform: translateX(-50%) translateY(10px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 85% { opacity: 1; } 100% { opacity: 0; } }

        /* Gacha */
        .gacha-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(5,5,20,0.97); display: none; flex-direction: column; align-items: center; justify-content: center; }
        .gacha-overlay.open { display: flex; }
        .gacha-header { color: #fff; margin-bottom: 20px; text-align: center; }
        .gacha-header h2 { font-size: 2em; background: linear-gradient(135deg, #ffd700, #ff8800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gacha-header .sub { color: #aaa; margin-top: 5px; }
        .gacha-actions { display: flex; gap: 12px; margin-top: 15px; }
        .gacha-actions button { padding: 12px 28px; border-radius: 8px; border: none; font-size: 1em; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .gacha-actions button:disabled { opacity: 0.3; cursor: default; }
        .gacha-actions .w1 { background: linear-gradient(135deg, #4488ff, #2255cc); color: #fff; }
        .gacha-actions .w10 { background: linear-gradient(135deg, #ff8800, #cc5500); color: #fff; }
        .gacha-actions .close-btn { background: rgba(255,255,255,0.1); color: #fff; }
        #gacha-results { display: flex; flex-wrap: wrap; gap: 10px; max-width: 700px; justify-content: center; margin-top: 20px; min-height: 100px; }
        .gacha-card { width: 110px; padding: 12px 8px; border-radius: 10px; text-align: center; animation: cardReveal 0.4s ease-out backwards; border: 2px solid rgba(255,255,255,0.1); }
        .gacha-card.common { background: rgba(100,100,100,0.3); border-color: #666; }
        .gacha-card.rare { background: rgba(80,80,200,0.3); border-color: #66f; }
        .gacha-card.epic { background: rgba(160,0,200,0.3); border-color: #c0f; }
        .gacha-card.legendary { background: rgba(200,150,0,0.3); border-color: #fa0; }
        .gacha-card .g-icon { font-size: 2em; }
        .gacha-card .g-name { color: #fff; font-size: 0.75em; margin-top: 4px; }
        .gacha-card .g-stars { color: #ffd700; font-size: 0.7em; }
        .gacha-card .g-rarity { color: #aaa; font-size: 0.6em; text-transform: uppercase; margin-top: 2px; }
        @keyframes cardReveal { 0% { opacity: 0; transform: scale(0.5) rotateY(90deg); } 100% { opacity: 1; transform: scale(1) rotateY(0); } }

        .controls-hint {
            position: fixed; bottom: 90px; left: 15px; z-index: 100;
            background: rgba(0,0,0,0.6); border-radius: 8px; padding: 8px 12px;
            color: #888; font-size: 0.7em; line-height: 1.6;
            backdrop-filter: blur(4px);
        }
        .controls-hint span { color: #fff; }

        .fps-counter {
            position: fixed; top: 5px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.4); font-size: 0.7em; z-index: 100;
        }
    </style>
</head>
<body>
    <div class="hud-top">
        <div class="char-info">
            <div class="name" id="hud-name">Traveler</div>
            <div class="element" id="hud-element">🌪️ Wind</div>
            <div class="hp-bar-outer"><div class="hp-bar-inner" id="hud-hp" style="width:100%"></div></div>
        </div>
    </div>

    <div class="hud-top-right">
        <div class="currency" id="hud-currency">💎 10,000</div>
        <div class="info" id="hud-enemies">Enemies: 0</div>
        <div class="info" id="hud-score">Score: 0</div>
    </div>

    <div class="party-bar" id="party-bar"></div>

    <div class="abilities">
        <div class="ability-btn"><span class="key">E</span><span>Skill</span><div class="cd" id="cd-skill"></div></div>
        <div class="ability-btn"><span class="key">Q</span><span>Burst</span><div class="cd" id="cd-burst"></div></div>
        <div class="ability-btn"><span class="key">G</span><span>Wish</span></div>
    </div>

    <div class="controls-hint">
        <span>WASD</span> Move | <span>Mouse</span> Look | <span>Click</span> Attack<br>
        <span>E</span> Skill | <span>Q</span> Burst | <span>G</span> Wish | <span>Space</span> Jump | <span>Shift</span> Sprint
    </div>

    <div class="fps-counter" id="fps-counter">-- FPS</div>

    <div class="gacha-overlay" id="gacha-overlay">
        <div class="gacha-header">
            <h2>✦ Wanderlust Invocation ✦</h2>
            <div class="sub" id="gacha-bal">💎 10,000</div>
            <div class="sub" id="gacha-pity">Pity: 0/90</div>
        </div>
        <div id="gacha-results"></div>
        <div class="gacha-actions">
            <button class="w1" id="btn-wish1" onclick="game.wish(1)">Wish ×1 (160💎)</button>
            <button class="w10" id="btn-wish10" onclick="game.wish(10)">Wish ×10 (1440💎)</button>
            <button class="close-btn" onclick="game.closeGacha()">Close [G]</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    var game = window.game || {};
    (function() {
        "use strict";

        // ============ GAME STATE ============
        var currency = 10000;
        var score = 0;
        var pityCount = 0;
        var gachaOpen = false;
        var activeCharIdx = 0;

        var party = [
            { name: 'Traveler', element: 'Wind', icon: '🌪️', color: 0x44ffaa, attack: 22, hp: 100, maxHp: 100, unlocked: true },
            { name: 'Amber', element: 'Fire', icon: '🔥', color: 0xff4444, attack: 28, hp: 90, maxHp: 90, unlocked: false },
            { name: 'Xingqiu', element: 'Water', icon: '💧', color: 0x4488ff, attack: 32, hp: 85, maxHp: 85, unlocked: false },
            { name: 'Noelle', element: 'Earth', icon: '🛡️', color: 0xffaa44, attack: 20, hp: 130, maxHp: 130, unlocked: false },
        ];

        var enemies = [];
        var cooldowns = { skill: 0, burst: 0 };

        // Input state
        var keys = {};
        var yaw = 0, pitch = 0;
        var mouseLocked = false;
        var isJumping = false;
        var playerY = 0;
        var vySpeed = 0;

        // Performance tracking
        var frameCount = 0, lastFpsTime = 0, currentFps = 60;

        // ======== THREE.JS SETUP (OPTIMIZED) ========
        var clock = new THREE.Clock();
        var scene = new THREE.Scene();

        // Simple sky background color
        scene.background = new THREE.Color(0x7ec8f0);

        // Fog - shorter for less overdraw (don't render distant objects)
        scene.fog = new THREE.Fog(0x7ec8f0, 40, 120);

        var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 130);
        camera.position.set(0, 4, 8);

        // Render at 75% resolution for performance, CSS scales up
        var renderScale = 0.75;
        var renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', alpha: false });
        renderer.setSize(window.innerWidth * renderScale, window.innerHeight * renderScale);
        renderer.domElement.style.width = '100%';
        renderer.domElement.style.height = '100%';
        renderer.setPixelRatio(1.0);
        renderer.shadowMap.enabled = false;
        document.body.appendChild(renderer.domElement);

        // No lights needed - using MeshBasicMaterial for max performance
        // Colors are baked into the materials directly

        // ======== WORLD (optimized with instancing) ========
        // Ground with vertex color variation for natural look
        var groundGeo = new THREE.PlaneGeometry(250, 250, 40, 40);
        var gVerts = groundGeo.attributes.position.array;
        var groundColors = [];
        for (var i = 0; i < gVerts.length; i += 3) {
            // Gentle hills
            var hx = gVerts[i], hz = gVerts[i+1];
            gVerts[i + 2] = Math.sin(hx * 0.02) * Math.cos(hz * 0.025) * 2.0 + Math.sin(hx * 0.07) * 0.3;
            // Vertex color variation (greens and browns)
            var noise = Math.random() * 0.12;
            var grassVar = Math.sin(hx * 0.1 + hz * 0.08) * 0.05;
            groundColors.push(0.22 + noise + grassVar, 0.55 + noise * 1.5, 0.2 + noise);
        }
        groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(groundColors, 3));
        groundGeo.computeVertexNormals();
        var groundMat = new THREE.MeshBasicMaterial({ vertexColors: true });
        var ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;

        scene.add(ground);

        // Stone paths (two crossing paths)
        var pathMat = new THREE.MeshBasicMaterial({ color: 0x9a8870 });
        var path1 = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 80, 1, 1), pathMat);
        path1.rotation.x = -Math.PI / 2; path1.position.y = 0.03;
        scene.add(path1);
        var path2 = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 80, 1, 1), pathMat);
        path2.rotation.x = -Math.PI / 2; path2.rotation.z = Math.PI / 2; path2.position.y = 0.03;
        scene.add(path2);

        // ---- INSTANCED TREES (much faster than individual groups) ----
        var treeTrunkGeo = new THREE.CylinderGeometry(0.15, 0.35, 3, 6);
        var treeTrunkMat = new THREE.MeshBasicMaterial({ color: 0x5c3a1e });
        var treeLeafGeo = new THREE.SphereGeometry(1.4, 6, 5);

        var treeCount = 40; // reduced from 50, instanced is faster anyway
        var treeTrunkInst = new THREE.InstancedMesh(treeTrunkGeo, treeTrunkMat, treeCount);

        // Multiple leaf colors for variety
        var leafMats = [
            new THREE.MeshBasicMaterial({ color: 0x2d8a2d }),
            new THREE.MeshBasicMaterial({ color: 0x3aaa3a }),
            new THREE.MeshBasicMaterial({ color: 0x1f7a3f }),
        ];
        var leafInsts = [];
        for (var lm = 0; lm < 3; lm++) {
            var li = new THREE.InstancedMesh(treeLeafGeo, leafMats[lm], treeCount);
            leafInsts.push(li);
        }

        var treeMatrix = new THREE.Matrix4();
        var scaleMatrix = new THREE.Matrix4();
        var treePositions = [];
        for (var i = 0; i < treeCount; i++) {
            var tx = (Math.random() - 0.5) * 200;
            var tz = (Math.random() - 0.5) * 200;
            if (Math.abs(tx) < 8 && Math.abs(tz) < 8) { tx += 15; tz += 15; }
            treePositions.push({x: tx, z: tz});
            var scale = 0.8 + Math.random() * 0.5;

            // Trunk
            treeMatrix.makeTranslation(tx, 1.5 * scale, tz);
            scaleMatrix.makeScale(scale, scale, scale);
            treeMatrix.multiply(scaleMatrix);
            treeTrunkInst.setMatrixAt(i, treeMatrix);

            // Leaf (each tree uses one of the 3 leaf mats)
            var leafIdx = i % 3;
            treeMatrix.makeTranslation(tx, 3.8 * scale, tz);
            scaleMatrix.makeScale(scale * 1.2, scale, scale * 1.2);
            treeMatrix.multiply(scaleMatrix);
            leafInsts[leafIdx].setMatrixAt(i, treeMatrix);
        }
        scene.add(treeTrunkInst);
        for (var li = 0; li < leafInsts.length; li++) scene.add(leafInsts[li]);

        // ---- INSTANCED ROCKS ----
        var rockGeo = new THREE.DodecahedronGeometry(1, 0);
        var rockMat = new THREE.MeshBasicMaterial({ color: 0x8a8a8a });
        var rockCount = 20;
        var rockInst = new THREE.InstancedMesh(rockGeo, rockMat, rockCount);
        var rockMatrix = new THREE.Matrix4();
        var rockScale = new THREE.Matrix4();
        for (var i = 0; i < rockCount; i++) {
            var rx = (Math.random() - 0.5) * 180;
            var rz = (Math.random() - 0.5) * 180;
            var rs = 0.4 + Math.random() * 0.9;
            rockMatrix.makeTranslation(rx, rs * 0.35, rz);
            rockScale.makeScale(rs, rs * 0.7, rs);
            rockMatrix.multiply(rockScale);
            rockInst.setMatrixAt(i, rockMatrix);
        }
        scene.add(rockInst);

        // ---- BUILDINGS (Mondstadt-inspired) ----
        function makeBuilding(x, z, w, h, d) {
            var g = new THREE.Group();
            // Walls with window texture approximation
            var walls = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshBasicMaterial({ color: 0xf0e8d8 })
            );
            walls.position.y = h / 2;

            g.add(walls);

            // Wooden trim
            var trim = new THREE.Mesh(
                new THREE.BoxGeometry(w + 0.2, 0.3, d + 0.2),
                new THREE.MeshBasicMaterial({ color: 0x5c3a1e })
            );
            trim.position.y = h;
            g.add(trim);

            // Blue roof
            var roofSize = Math.max(w, d) * 0.8;
            var roof = new THREE.Mesh(
                new THREE.ConeGeometry(roofSize, 3.5, 4),
                new THREE.MeshBasicMaterial({ color: 0x1a4488 })
            );
            roof.position.y = h + 1.75;
            roof.rotation.y = Math.PI / 4;

            g.add(roof);

            // Glowing windows
            var winMat = new THREE.MeshBasicMaterial({ color: 0xffeeaa });
            for (var wy = 0; wy < 2; wy++) {
                for (var wx = 0; wx < 2; wx++) {
                    var win = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.0), winMat);
                    win.position.set(-w / 2 - 0.01, h * 0.35 + wy * h * 0.35, (wx - 0.5) * d * 0.4);
                    win.rotation.y = -Math.PI / 2;
                    g.add(win);
                    var win2 = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.0), winMat);
                    win2.position.set(w / 2 + 0.01, h * 0.35 + wy * h * 0.35, (wx - 0.5) * d * 0.4);
                    win2.rotation.y = Math.PI / 2;
                    g.add(win2);
                }
            }


            g.position.set(x, 0, z);
            scene.add(g);
        }

        makeBuilding(25, -20, 7, 7, 6);
        makeBuilding(-30, 25, 5, 5.5, 5);
        makeBuilding(35, 35, 9, 9, 7);
        makeBuilding(-20, -40, 6, 6, 6);
        makeBuilding(0, -30, 4, 4, 4);

        // ---- WATER (animated, reflective) ----
        var waterGeo = new THREE.CircleGeometry(14, 32);
        var waterMat = new THREE.MeshBasicMaterial({
            color: 0x3399dd, transparent: true, opacity: 0.65
        });
        var water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.set(-20, 0.08, -25);
        scene.add(water);

        // ---- TELEPORT WAYPOINT (glowing + particles) ----
        var wpGeo = new THREE.OctahedronGeometry(0.8, 0);
        var wpMat = new THREE.MeshBasicMaterial({ color: 0x44eeff, transparent: true, opacity: 0.85 });
        var waypoint = new THREE.Mesh(wpGeo, wpMat);
        waypoint.position.set(0, 2, -8);
        scene.add(waypoint);
        // Glow ring around waypoint
        var wpRing = new THREE.Mesh(
            new THREE.RingGeometry(1.5, 2.0, 24),
            new THREE.MeshBasicMaterial({ color: 0x44eeff, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
        );
        wpRing.rotation.x = -Math.PI / 2;
        wpRing.position.set(0, 0.1, -8);
        scene.add(wpRing);

        // ---- FLOATING PARTICLES (ambient atmosphere) ----
        var particleCount = 30;
        var pGeo = new THREE.BufferGeometry();
        var pPositions = new Float32Array(particleCount * 3);
        for (var i = 0; i < particleCount; i++) {
            pPositions[i * 3] = (Math.random() - 0.5) * 60;
            pPositions[i * 3 + 1] = 1 + Math.random() * 6;
            pPositions[i * 3 + 2] = (Math.random() - 0.5) * 60;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        var pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.5 });
        var particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // ---- CLOUDS (simple billboard planes) ----
        var cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
        for (var i = 0; i < 5; i++) {
            var cloudW = 18 + Math.random() * 15;
            var cloud = new THREE.Mesh(new THREE.PlaneGeometry(cloudW, 5), cloudMat);
            cloud.position.set((Math.random() - 0.5) * 140, 50 + Math.random() * 15, (Math.random() - 0.5) * 140);
            cloud.rotation.x = -Math.PI / 2;
            cloud.rotation.z = Math.random() * Math.PI;
            scene.add(cloud);
        }

        // ---- GRASS PATCHES (flat billboards on ground) ----
        var grassMat = new THREE.MeshBasicMaterial({ color: 0x3a8a3a, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
        var grassGeo = new THREE.PlaneGeometry(0.3, 0.6);
        var grassCount = 40;
        var grassInst = new THREE.InstancedMesh(grassGeo, grassMat, grassCount);
        var gm = new THREE.Matrix4();
        var rotM = new THREE.Matrix4();
        for (var i = 0; i < grassCount; i++) {
            var gx = (Math.random() - 0.5) * 50;
            var gz = (Math.random() - 0.5) * 50;
            gm.makeTranslation(gx, 0.3, gz);
            rotM.makeRotationY(Math.random() * Math.PI);
            gm.multiply(rotM);
            grassInst.setMatrixAt(i, gm);
        }
        scene.add(grassInst);

        // ======== PLAYER (improved model) ========
        var playerGroup = new THREE.Group();

        // Body (torso)
        var pBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.28, 0.35, 1.1, 10),
            new THREE.MeshBasicMaterial({ color: 0x44ffaa })
        );
        pBody.position.y = 1.1;
        playerGroup.add(pBody);

        // Cape/scarf (Genshin-style flowing back piece)
        var capeMat = new THREE.MeshBasicMaterial({ color: 0x224466, side: THREE.DoubleSide });
        var cape = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.9), capeMat);
        cape.position.set(0, 1.0, 0.3);
        cape.rotation.x = 0.2;
        playerGroup.add(cape);

        // Head
        var pHead = new THREE.Mesh(
            new THREE.SphereGeometry(0.28, 12, 10),
            new THREE.MeshBasicMaterial({ color: 0xffddbb })
        );
        pHead.position.y = 1.9;
        playerGroup.add(pHead);

        // Hair
        var pHair = new THREE.Mesh(
            new THREE.SphereGeometry(0.3, 8, 6, 0, Math.PI * 2, 0, Math.PI * 0.6),
            new THREE.MeshBasicMaterial({ color: 0x333355 })
        );
        pHair.position.y = 2.0;
        pHair.rotation.x = -0.2;
        playerGroup.add(pHair);

        // Sword (glowing edge)
        var pSword = new THREE.Mesh(
            new THREE.BoxGeometry(0.05, 1.0, 0.05),
            new THREE.MeshBasicMaterial({ color: 0xddeeff })
        );
        pSword.position.set(0.5, 1.1, 0);
        playerGroup.add(pSword);

        // Sword guard
        var pGuard = new THREE.Mesh(
            new THREE.BoxGeometry(0.25, 0.06, 0.06),
            new THREE.MeshBasicMaterial({ color: 0xaa8833 })
        );
        pGuard.position.set(0.5, 0.65, 0);
        playerGroup.add(pGuard);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // ======== ENEMIES (improved visuals) ========
        function spawnEnemy() {
            if (enemies.length >= 8) return; // cap for performance
            var angle = Math.random() * Math.PI * 2;
            var dist = 18 + Math.random() * 30;
            var ex = playerGroup.position.x + Math.cos(angle) * dist;
            var ez = playerGroup.position.z + Math.sin(angle) * dist;

            var types = [
                { name: 'Slime', color: 0x66ee66, glowColor: 0x88ff88, hp: 40, size: 0.55, speed: 2.2, reward: 60 },
                { name: 'Hilichurl', color: 0x886644, glowColor: 0xaa8866, hp: 70, size: 0.6, speed: 2.8, reward: 100 },
                { name: 'Abyss Mage', color: 0x7744cc, glowColor: 0xaa66ff, hp: 120, size: 0.7, speed: 1.8, reward: 200 },
            ];
            var type = types[Math.floor(Math.random() * types.length)];

            var mesh = new THREE.Group();
            // Body
            var body = new THREE.Mesh(
                new THREE.SphereGeometry(type.size, 8, 6),
                new THREE.MeshBasicMaterial({ color: type.color })
            );
            body.position.y = type.size;
            mesh.add(body);

            // Eyes (brighter, animated)
            var eyeGeo = new THREE.SphereGeometry(type.size * 0.12, 6, 6);
            var eyeMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
            var e1 = new THREE.Mesh(eyeGeo, eyeMat);
            e1.position.set(-type.size * 0.3, type.size * 1.2, type.size * 0.7);
            mesh.add(e1);
            var e2 = new THREE.Mesh(eyeGeo, eyeMat);
            e2.position.set(type.size * 0.3, type.size * 1.2, type.size * 0.7);
            mesh.add(e2);

            mesh.position.set(ex, 0, ez);
            scene.add(mesh);

            var hpBar = document.createElement('div');
            hpBar.className = 'enemy-hp-bar';
            hpBar.innerHTML = '<div class="name">' + type.name + '</div><div class="track"><div class="fill" style="width:100%"></div></div>';
            document.body.appendChild(hpBar);

            enemies.push({
                mesh: mesh, hp: type.hp, maxHp: type.hp,
                speed: type.speed, reward: type.reward,
                name: type.name, size: type.size, hpBar: hpBar
            });
        }

        // Spawn initial wave
        setTimeout(function() {
            for (var i = 0; i < 6; i++) spawnEnemy();
            updateHUD();
        }, 300);

        // ======== INPUT ========
        document.addEventListener('keydown', function(e) {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'g') game.toggleGacha();
            if (e.key === 'e') game.useAbility('skill');
            if (e.key === 'q') game.useAbility('burst');
            if (e.key >= '1' && e.key <= '4') game.switchChar(parseInt(e.key) - 1);
            if (e.key === ' ') { e.preventDefault(); doJump(); }
        });
        document.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });

        renderer.domElement.addEventListener('click', function() {
            if (gachaOpen) return;
            renderer.domElement.requestPointerLock();
        });
        document.addEventListener('pointerlockchange', function() {
            mouseLocked = (document.pointerLockElement === renderer.domElement);
        });
        document.addEventListener('mousemove', function(e) {
            if (!mouseLocked) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-1.2, Math.min(1.0, pitch));
        });
        renderer.domElement.addEventListener('mousedown', function(e) {
            if (!mouseLocked) return;
            if (e.button === 0) doAttack();
        });

        // ======== COMBAT (improved effects) ========
        var screenShake = 0;

        function doAttack() {
            var char = party[activeCharIdx];
            var range = 4.5;

            for (var i = enemies.length - 1; i >= 0; i--) {
                var en = enemies[i];
                var d = playerGroup.position.distanceTo(en.mesh.position);
                if (d < range) {
                    var dmg = char.attack + Math.floor(Math.random() * 12);
                    en.hp -= dmg;
                    showDamage(en.mesh.position, dmg, false);
                    screenShake = 0.03;

                    if (en.hp <= 0) killEnemy(i);
                    else en.hpBar.querySelector('.fill').style.width = (en.hp / en.maxHp * 100) + '%';
                }
            }

            // Sword swing animation
            pSword.rotation.z = -1.0;
            pSword.material.color.setHex(0xffffff);
            setTimeout(function() { pSword.rotation.z = 0; pSword.material.color.setHex(0xddeeff); }, 120);
        }

        function killEnemy(idx) {
            var en = enemies[idx];
            scene.remove(en.mesh);
            en.hpBar.remove();
            enemies.splice(idx, 1);
            currency += en.reward;
            score += en.reward;
            showKill(en.name, en.reward);
            // Burst particles on death
            spawnDeathParticles(en.mesh.position);
            updateHUD();
            setTimeout(spawnEnemy, 3000 + Math.random() * 2000);
        }

        // Death particle effect
        function spawnDeathParticles(pos) {
            var count = 8;
            for (var i = 0; i < count; i++) {
                var p = new THREE.Mesh(
                    new THREE.SphereGeometry(0.08, 4, 4),
                    new THREE.MeshBasicMaterial({ color: 0xffdd44, transparent: true, opacity: 1.0 })
                );
                p.position.copy(pos);
                p.position.y += 0.5;
                p.userData.vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 4,
                    2 + Math.random() * 3,
                    (Math.random() - 0.5) * 4
                );
                p.userData.life = 0.6;
                scene.add(p);
                deathParticles.push(p);
            }
        }
        var deathParticles = [];

        game.useAbility = function(type) {
            if (gachaOpen) return;
            var char = party[activeCharIdx];

            if (type === 'skill' && cooldowns.skill <= 0) {
                cooldowns.skill = 6;
                var range = 8;
                screenShake = 0.06;

                // Enhanced visual ring with glow
                var ring = new THREE.Mesh(
                    new THREE.RingGeometry(0.5, range, 24),
                    new THREE.MeshBasicMaterial({ color: char.color, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
                );
                ring.rotation.x = -Math.PI / 2;
                ring.position.copy(playerGroup.position);
                ring.position.y = 0.15;
                scene.add(ring);

                // Inner glow
                var inner = new THREE.Mesh(
                    new THREE.CircleGeometry(range, 24),
                    new THREE.MeshBasicMaterial({ color: char.color, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
                );
                inner.rotation.x = -Math.PI / 2;
                inner.position.copy(playerGroup.position);
                inner.position.y = 0.12;
                scene.add(inner);

                setTimeout(function() { scene.remove(ring); scene.remove(inner); }, 500);

                for (var i = enemies.length - 1; i >= 0; i--) {
                    var en = enemies[i];
                    if (playerGroup.position.distanceTo(en.mesh.position) < range) {
                        var dmg = char.attack * 2 + Math.floor(Math.random() * 15);
                        en.hp -= dmg;
                        showDamage(en.mesh.position, dmg, true);
                        if (en.hp <= 0) killEnemy(i);
                        else en.hpBar.querySelector('.fill').style.width = (en.hp / en.maxHp * 100) + '%';
                    }
                }
            } else if (type === 'burst' && cooldowns.burst <= 0) {
                cooldowns.burst = 15;
                var range = 14;
                screenShake = 0.12;

                // Enhanced burst visual
                var sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(range * 0.3, 12, 8),
                    new THREE.MeshBasicMaterial({ color: char.color, transparent: true, opacity: 0.5 })
                );
                sphere.position.copy(playerGroup.position);
                sphere.position.y = 1;
                scene.add(sphere);

                var outerRing = new THREE.Mesh(
                    new THREE.RingGeometry(range * 0.8, range, 20),
                    new THREE.MeshBasicMaterial({ color: char.color, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
                );
                outerRing.rotation.x = -Math.PI / 2;
                outerRing.position.copy(playerGroup.position);
                outerRing.position.y = 0.2;
                scene.add(outerRing);

                setTimeout(function() { scene.remove(sphere); scene.remove(outerRing); }, 700);

                for (var i = enemies.length - 1; i >= 0; i--) {
                    var en = enemies[i];
                    if (playerGroup.position.distanceTo(en.mesh.position) < range) {
                        var dmg = char.attack * 5 + Math.floor(Math.random() * 40);
                        en.hp -= dmg;
                        showDamage(en.mesh.position, dmg, true);
                        if (en.hp <= 0) killEnemy(i);
                        else en.hpBar.querySelector('.fill').style.width = (en.hp / en.maxHp * 100) + '%';
                    }
                }
            }
        };

        function doJump() {
            if (!isJumping) {
                isJumping = true;
                vySpeed = 0.18;
            }
        }

        game.switchChar = function(idx) {
            if (idx < 0 || idx >= 4) return;
            if (!party[idx].unlocked) return;
            activeCharIdx = idx;
            var c = party[idx];
            pBody.material.color.setHex(c.color);
            capeMat.color.setHex(c.color * 0.5 + 0x111111);
            document.getElementById('hud-name').textContent = c.name;
            document.getElementById('hud-element').textContent = getElIcon(c.element) + ' ' + c.element;
            updatePartyUI();
            updateHUD();
        };

        // ======== GACHA ========
        var POOL = [
            { name: 'Slime', rarity: 'common', icon: '🟢', stars: 1 },
            { name: 'Hilichurl', rarity: 'common', icon: '👺', stars: 1 },
            { name: 'Bat', rarity: 'common', icon: '🦇', stars: 1 },
            { name: 'Boar', rarity: 'common', icon: '🐗', stars: 1 },
            { name: 'Amber', rarity: 'rare', icon: '🔥', stars: 4, partyIdx: 1 },
            { name: 'Xingqiu', rarity: 'rare', icon: '💧', stars: 4, partyIdx: 2 },
            { name: 'Fischl', rarity: 'rare', icon: '⚡', stars: 4 },
            { name: 'Beidou', rarity: 'rare', icon: '🌊', stars: 4 },
            { name: 'Keqing', rarity: 'epic', icon: '⚡', stars: 5 },
            { name: 'Noelle', rarity: 'epic', icon: '🛡️', stars: 5, partyIdx: 3 },
            { name: 'Zhongli', rarity: 'legendary', icon: '🏔️', stars: 5 },
            { name: 'Raiden', rarity: 'legendary', icon: '⚡', stars: 5 },
        ];

        game.wish = function(count) {
            var cost = count === 1 ? 160 : 1440;
            if (currency < cost) return;
            currency -= cost;

            var results = [];
            for (var i = 0; i < count; i++) {
                pityCount++;
                var rarity;
                if (pityCount >= 90) { rarity = 'legendary'; pityCount = 0; }
                else if (pityCount >= 75) { rarity = Math.random() < 0.3 ? 'legendary' : (Math.random() < 0.5 ? 'epic' : 'rare'); }
                else {
                    var r = Math.random();
                    if (r < 0.016) { rarity = 'legendary'; pityCount = 0; }
                    else if (r < 0.07) rarity = 'epic';
                    else if (r < 0.35) rarity = 'rare';
                    else rarity = 'common';
                }
                if (i === 9 && results.every(function(r) { return r.rarity === 'common'; })) rarity = 'rare';

                var pool = POOL.filter(function(c) { return c.rarity === rarity; });
                var pulled = pool[Math.floor(Math.random() * pool.length)];
                results.push(pulled);

                if (pulled.partyIdx !== undefined && !party[pulled.partyIdx].unlocked) {
                    party[pulled.partyIdx].unlocked = true;
                    updatePartyUI();
                }
            }

            var html = results.map(function(c, i) {
                var starsStr = '★'.repeat(c.stars);
                return '<div class="gacha-card ' + c.rarity + '" style="animation-delay:' + i * 0.08 + 's">' +
                    '<div class="g-icon">' + c.icon + '</div>' +
                    '<div class="g-name">' + c.name + '</div>' +
                    '<div class="g-stars">' + starsStr + '</div>' +
                    '<div class="g-rarity">' + c.rarity + '</div></div>';
            }).join('');
            document.getElementById('gacha-results').innerHTML = html;

            updateHUD();
            document.getElementById('gacha-bal').textContent = '💎 ' + currency.toLocaleString();
            document.getElementById('gacha-pity').textContent = 'Pity: ' + pityCount + '/90';
            document.getElementById('btn-wish1').disabled = currency < 160;
            document.getElementById('btn-wish10').disabled = currency < 1440;
        };

        game.openGacha = function() { if (!gachaOpen) game.toggleGacha(); };
        game.closeGacha = function() { if (gachaOpen) game.toggleGacha(); };
        game.toggleGacha = function() {
            gachaOpen = !gachaOpen;
            document.getElementById('gacha-overlay').classList.toggle('open', gachaOpen);
            if (gachaOpen) {
                document.exitPointerLock();
                document.getElementById('gacha-bal').textContent = '💎 ' + currency.toLocaleString();
                document.getElementById('gacha-pity').textContent = 'Pity: ' + pityCount + '/90';
                document.getElementById('btn-wish1').disabled = currency < 160;
                document.getElementById('btn-wish10').disabled = currency < 1440;
            }
        };

        // ======== UI ========
        function showDamage(pos, amount, isElemental) {
            var sp = pos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.5, 1.5, 0));
            sp.project(camera);
            if (sp.z > 1) return; // behind camera
            var x = (sp.x * 0.5 + 0.5) * window.innerWidth;
            var y = (-sp.y * 0.5 + 0.5) * window.innerHeight;
            var el = document.createElement('div');
            el.className = 'dmg-popup ' + (isElemental ? 'element' : 'normal');
            el.textContent = amount;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(function() { el.remove(); }, 800);
        }

        function showKill(name, reward) {
            var el = document.createElement('div');
            el.className = 'kill-banner';
            el.textContent = '⚔ ' + name + ' defeated! +' + reward + '💎';
            document.body.appendChild(el);
            setTimeout(function() { el.remove(); }, 1500);
        }

        function getElIcon(el) {
            return { Fire: '🔥', Water: '💧', Wind: '🌪️', Earth: '🌍', Lightning: '⚡' }[el] || '✨';
        }

        function updateHUD() {
            var c = party[activeCharIdx];
            document.getElementById('hud-currency').textContent = '💎 ' + currency.toLocaleString();
            document.getElementById('hud-enemies').textContent = 'Enemies: ' + enemies.length;
            document.getElementById('hud-score').textContent = 'Score: ' + score.toLocaleString();
            document.getElementById('hud-hp').style.width = (c.hp / c.maxHp * 100) + '%';
        }

        function updatePartyUI() {
            var bar = document.getElementById('party-bar');
            bar.innerHTML = '';
            for (var i = 0; i < 4; i++) {
                var p = party[i];
                var div = document.createElement('div');
                div.className = 'party-slot' + (i === activeCharIdx ? ' active' : '') + (!p.unlocked ? ' locked' : '');
                div.innerHTML = '<span class="key-hint">' + (i + 1) + '</span>' +
                    (p.unlocked ? p.icon : '🔒') +
                    (p.unlocked ? '<div class="mini-hp"><div class="mini-hp-fill" style="width:' + (p.hp / p.maxHp * 100) + '%"></div></div>' : '');
                div.onclick = (function(idx) { return function() { game.switchChar(idx); }; })(i);
                bar.appendChild(div);
            }
        }
        updatePartyUI();

        // ======== GAME LOOP (optimized) ========
        var tempVec = new THREE.Vector3();
        var forwardVec = new THREE.Vector3();
        var rightVec = new THREE.Vector3();
        var camOffset = new THREE.Vector3();
        var yAxis = new THREE.Vector3(0, 1, 0);
        var xAxis = new THREE.Vector3(1, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            var dt = clock.getDelta();
            dt = Math.min(dt, 0.05); // clamp to avoid physics explosions

            // FPS counter
            frameCount++;
            var now = performance.now();
            if (now - lastFpsTime > 1000) {
                currentFps = frameCount;
                frameCount = 0;
                lastFpsTime = now;
                document.getElementById('fps-counter').textContent = currentFps + ' FPS';
            }

            if (!gachaOpen) {
                // Movement
                if (mouseLocked) {
                    var speed = 7 * dt;
                    var sprintMult = keys['shift'] ? 1.6 : 1.0;
                    forwardVec.set(0, 0, -1).applyAxisAngle(yAxis, yaw);
                    rightVec.set(1, 0, 0).applyAxisAngle(yAxis, yaw);

                    if (keys['w']) playerGroup.position.addScaledVector(forwardVec, speed * sprintMult);
                    if (keys['s']) playerGroup.position.addScaledVector(forwardVec, -speed * 0.7);
                    if (keys['a']) playerGroup.position.addScaledVector(rightVec, -speed * 0.8);
                    if (keys['d']) playerGroup.position.addScaledVector(rightVec, speed * 0.8);
                }

                // Jump physics
                if (isJumping) {
                    vySpeed -= 0.6 * dt;
                    playerY += vySpeed;
                    if (playerY <= 0) { playerY = 0; isJumping = false; vySpeed = 0; }
                }
                playerGroup.position.y = playerY;

                // Bounds
                playerGroup.position.x = Math.max(-115, Math.min(115, playerGroup.position.x));
                playerGroup.position.z = Math.max(-115, Math.min(115, playerGroup.position.z));

                // Player rotation (smooth)
                playerGroup.rotation.y = yaw;

                // Cape sway
                cape.rotation.x = 0.2 + Math.sin(now * 0.003) * 0.08;
            }

            // Camera (smooth third-person)
            var camDist = 5.5;
            var camHeight = 2.8;
            camOffset.set(0, camHeight, camDist);
            camOffset.applyAxisAngle(xAxis, pitch * 0.5);
            camOffset.applyAxisAngle(yAxis, yaw);

            // Screen shake
            if (screenShake > 0) {
                camOffset.x += (Math.random() - 0.5) * screenShake * 4;
                camOffset.y += (Math.random() - 0.5) * screenShake * 3;
                screenShake *= 0.85;
                if (screenShake < 0.002) screenShake = 0;
            }

            camera.position.copy(playerGroup.position).add(camOffset);
            tempVec.copy(playerGroup.position);
            tempVec.y += 1.5;
            camera.lookAt(tempVec);



            // Enemy AI (simplified distance check first)
            for (var i = 0; i < enemies.length; i++) {
                var en = enemies[i];
                tempVec.subVectors(playerGroup.position, en.mesh.position);
                var dist = tempVec.length();

                if (dist < 40 && dist > 2) {
                    tempVec.normalize();
                    en.mesh.position.addScaledVector(tempVec, en.speed * dt);
                    en.mesh.lookAt(playerGroup.position);
                }

                // Enemy attack
                if (dist < 2.5 && Math.random() < 1.5 * dt) {
                    var c = party[activeCharIdx];
                    c.hp = Math.max(0, c.hp - 3);
                    updateHUD();
                    screenShake = 0.02;
                }

                // Bounce animation
                en.mesh.children[0].position.y = en.size + Math.sin(now * 0.004 + i * 1.7) * 0.12;

                // HP bar screen pos (only update every 2nd frame for perf)
                if ((frameCount + i) % 2 === 0) {
                    tempVec.copy(en.mesh.position);
                    tempVec.y += en.size * 2.5;
                    tempVec.project(camera);
                    if (tempVec.z < 1 && dist < 35) {
                        en.hpBar.style.display = 'block';
                        en.hpBar.style.left = ((tempVec.x * 0.5 + 0.5) * window.innerWidth) + 'px';
                        en.hpBar.style.top = ((-tempVec.y * 0.5 + 0.5) * window.innerHeight) + 'px';
                    } else {
                        en.hpBar.style.display = 'none';
                    }
                }
            }

            // Death particles update
            for (var i = deathParticles.length - 1; i >= 0; i--) {
                var p = deathParticles[i];
                p.userData.life -= dt;
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    deathParticles.splice(i, 1);
                } else {
                    p.position.addScaledVector(p.userData.vel, dt);
                    p.userData.vel.y -= 5 * dt;
                    p.material.opacity = p.userData.life / 0.6;
                }
            }

            // Cooldowns
            if (cooldowns.skill > 0) {
                cooldowns.skill -= dt;
                document.getElementById('cd-skill').style.display = 'flex';
                document.getElementById('cd-skill').textContent = Math.ceil(cooldowns.skill) + 's';
            } else {
                document.getElementById('cd-skill').style.display = 'none';
            }
            if (cooldowns.burst > 0) {
                cooldowns.burst -= dt;
                document.getElementById('cd-burst').style.display = 'flex';
                document.getElementById('cd-burst').textContent = Math.ceil(cooldowns.burst) + 's';
            } else {
                document.getElementById('cd-burst').style.display = 'none';
            }

            // HP regen
            var c = party[activeCharIdx];
            if (c.hp < c.maxHp) {
                c.hp = Math.min(c.maxHp, c.hp + dt * 2);
                updateHUD();
            }

            // Waypoint animation
            waypoint.rotation.y += dt * 2;
            waypoint.position.y = 2 + Math.sin(now * 0.002) * 0.3;
            wpRing.rotation.z += dt * 0.5;

            // Ambient particles drift (update every 4th frame)
            if (frameCount % 4 === 0) {
                var pArr = particles.geometry.attributes.position.array;
                for (var i = 0; i < particleCount; i++) {
                    pArr[i * 3 + 1] += 0.01;
                    if (pArr[i * 3 + 1] > 8) pArr[i * 3 + 1] = 1;
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }

            // Water animation (gentle wave)
            water.position.y = 0.08 + Math.sin(now * 0.001) * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        // Respawn enemies periodically
        setInterval(function() {
            if (enemies.length < 6) spawnEnemy();
        }, 5000);

        // Resize
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth * renderScale, window.innerHeight * renderScale);
        });

        // Earn currency over time
        setInterval(function() {
            currency += 50;
            updateHUD();
        }, 10000);

    })();
    </script>
</body>
</html>
